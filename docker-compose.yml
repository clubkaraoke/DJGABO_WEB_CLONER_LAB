services:
  web-cloner-lab:
    build: .
    container_name: djgabo-web-cloner-lab
    restart: unless-stopped
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      MAX_CONCURRENT_JOBS: 1
      MAX_QUEUE: 5
      JOB_TIMEOUT_MS: 120000
      RATE_LIMIT_PER_HOUR: 12
    volumes:
      - ./captures:/app/captures
    security_opt:
      - no-new-privileges:true
